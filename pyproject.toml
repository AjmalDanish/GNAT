[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-network-anomaly-tracker"
version = "1.0.0"
description = "AI-powered Global Network Anomaly Tracker using Django, Graph Neural Networks, and Interactive Visualization"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GNAT Development Team", email = "dev@gnat.example.com"}
]
keywords = [
    "django",
    "network-security",
    "anomaly-detection",
    "graph-neural-networks",
    "pytorch-geometric",
    "visualization",
    "cybersecurity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "Django>=5.0.0,<5.1.0",
    "djangorestframework>=3.14.0,<4.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "celery>=5.3.0,<6.0.0",
    "redis>=5.0.0,<6.0.0",
    "torch>=2.1.0,<3.0.0",
    "torch-geometric>=2.4.0,<3.0.0",
    "networkx>=3.2.0,<4.0.0",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "plotly>=5.18.0,<6.0.0",
    "django-environ>=0.11.0,<1.0.0",
    "django-cors-headers>=4.3.0,<5.0.0",
    "django-filter>=24.0.0,<25.0.0",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=4.2.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
]
production = [
    "gunicorn>=21.2.0",
    "whitenoise>=6.6.0",
    "sentry-sdk>=1.40.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/Global-Network-Anomaly-Tracker"
Documentation = "https://gnat.readthedocs.io"
Repository = "https://github.com/yourusername/Global-Network-Anomaly-Tracker"
Issues = "https://github.com/yourusername/Global-Network-Anomaly-Tracker/issues"
Changelog = "https://github.com/yourusername/Global-Network-Anomaly-Tracker/blob/main/CHANGELOG.md"

[project.scripts]
gnat = "config.manage:main"

# ============================================================================
# Black Configuration
# ============================================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''
skip-string-normalization = false
preview = true

# ============================================================================
# isort Configuration
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip_glob = ["*/migrations/*"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_django = ["django", "rest_framework", "celery"]

# ============================================================================
# Mypy Configuration
# ============================================================================
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
warn_return_any = false  # Allow Any returns for __str__ methods
# Plugins removed - requires mypy-django and mypy-drf installation
# plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torch_geometric.*",
    "networkx.*",
    "plotly.*",
    "celery.*",
    "factory_boy.*",
    "django.*",
    "djangorestframework.*",
]
ignore_missing_imports = true
disallow_untyped_defs = false

# [tool.django-stubs]
# django_settings_module = "config.settings.development"

# [tool.drf-stubs]
# strict = true

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings.testing"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
    "--cov=apps/graph_engine",
    "--cov-report=term-missing",
    "--cov-report=html",
    # "--cov-fail-under=85",  # Disabled for infrastructure phase
    # "--reuse-db",  # Requires pytest-django
    # "--nomigrations",  # Requires pytest-django
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["apps", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "manage.py",
    "*/asgi.py",
    "*/wsgi.py",
    "*/settings/*",
    # PR #14 (Synthetic Data Generator): repositories.py not used in PR #15
    # Repository layer requires dedicated testing in future PR
    "apps/graph_engine/repositories.py",
    # Phase 3: REST API (not implemented yet)
    "apps/graph_engine/views.py",
    "apps/graph_engine/urls.py",
    "apps/graph_engine/serializers.py",
    # Phase 4: Event-driven architecture (not implemented yet)
    "apps/graph_engine/signals.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if settings.DEBUG",
    "if DEBUG",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# ============================================================================
# Flake8 Configuration
# ============================================================================
[tool.flake8]
max-line-length = 100
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "migrations",
]
ignore = [
    "E203",
    "W503",
]
per-file-ignores = [
    "__init__.py:F401",
]

# ============================================================================
# Pylint Configuration
# ============================================================================
[tool.pylint.main]
py-version = "3.12"
ignore = ["migrations"]
jobs = 0
limit-inference-results = 100
persistent = true
suggestion-mode = true

[tool.pylint.messages_control]
disable = [
    "C0114",
    "C0115",
    "C0116",
    "R0903",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["_", "e", "ex", "pk", "id"]